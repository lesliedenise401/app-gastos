<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3F6D73">
  <title>Sin conexión · Mi Bolsillo</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#F6F8FA;color:#243746;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px;box-sizing:border-box}
    main{max-width:360px;text-align:center;background:#fff;border:1px solid #DCE3E7;border-radius:20px;padding:32px 24px}
    .ico{width:64px;height:64px;border-radius:20px;background:#E1EFF0;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:30px}
    h1{font-size:20px;margin:0 0 8px} p{color:#647582;font-size:14px;line-height:1.5;margin:0 0 20px}
    button{background:#3F6D73;color:#fff;border:0;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="ico" aria-hidden="true">📡</div>
    <h1>Estás sin conexión</h1>
    <p>Esta pantalla todavía no se guardó en tu dispositivo. Abre Mi Bolsillo una vez con internet y después funcionará sin conexión.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
